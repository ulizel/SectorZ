<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2a3442" />
    <title>Sector Z</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="touch"></div>

    <div id="hud">
      <!-- Top-left column: wave, health, weapon/ammo/grenades, reload (keeps the thumb areas clear). -->
      <div id="hud-top">
        <div id="wave-info"></div>
        <div id="health"><div id="health-fill"></div></div>
        <div id="weapon">
          <div id="ammo-row"><span id="weapon-name">PISTOL</span><span id="ammo">12</span><span id="reserve">/ ∞</span><span id="grenade-count">💣3</span></div>
          <div id="ammo-warn"></div>
          <div id="reload"><div id="reload-sweet"></div><div id="reload-bar"></div></div>
        </div>
      </div>
      <button id="reload-btn" aria-label="Reload">R</button>
      <button id="switch-btn" aria-label="Switch weapon">⇄</button>
      <button id="grenade-btn" aria-label="Grenade">💣<span>3</span></button>
      <button id="pause-btn" aria-label="Pause">II</button>
      <button id="fps-toggle" aria-label="Toggle performance overlay">FPS</button>
      <button id="aim-toggle" aria-label="Toggle aim direction">AIM: PULL</button>
      <pre id="debug"></pre>
      <div id="wave-info"></div>
      <div id="banner"><div class="big"></div><div class="small"></div></div>
      <div id="toast"></div>
      <div id="upgrades"><div class="title">CHOOSE AN UPGRADE</div><div class="cards"></div></div>
      <div id="lab-panel">
        <button data-lab="type">WALK</button><button data-lab="spawn">SPAWN</button><button data-lab="boom">BOOM</button><button data-lab="slow">SLOW</button><button data-lab="ai" class="on">AI</button><button data-lab="clear">CLEAR</button>
      </div>
      <div id="hitmarker"><i></i><i></i><i></i><i></i></div>
    </div>

    <div id="hurt"></div>
    <div id="pause"><h2>PAUSED</h2><button data-pause="resume">RESUME</button><button data-pause="restart">RESTART</button><button data-pause="menu">MAIN MENU</button></div>
    <div id="dead"><h2>YOU DIED</h2><p class="kills"></p><button id="restart">RESTART</button><button class="menu" data-menu>MAIN MENU</button></div>

    <div id="title">
      <h1>SECTOR&nbsp;<span>Z</span></h1>
      <p class="sub">prototype · player movement &amp; shooting</p>
      <button id="start" disabled>LOADING…</button>
      <button id="start-lab" class="secondary" disabled>RAGDOLL LAB</button>
      <p id="status">Loading…</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
